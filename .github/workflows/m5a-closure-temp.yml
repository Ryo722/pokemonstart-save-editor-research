name: m5a-closure-temp

on:
  push:
    branches:
      - m5a-family-closure-design

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full repository unittest suite
        run: python3 -m unittest discover -s tests -v
